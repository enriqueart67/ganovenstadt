plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = 'de.peregrine'

base { archivesName = 'peregrine-client' }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// "26.1.2" -> "26.1": das Mod-Jar passt fuer die ganze Versionsreihe (26.1, 26.1.1, 26.1.2 …)
def mcSeries = project.minecraft_version.tokenize('.').take(2).join('.')

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc_series', mcSeries
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': mcSeries
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
